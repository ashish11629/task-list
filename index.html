<!-- index.html -->
<div class="wrap">
  <div class="addrow">
    <input id="title" placeholder="Add a task…" />
    <select id="status">
      <option value="todo">todo</option>
      <option value="in-progress">in-progress</option>
      <option value="done">done</option>
    </select>
    <button id="add">Add</button>
  </div>
  <div id="chips"></div>
  <ul id="list"></ul>
</div>

<style>
  /* styles.css */
.wrap { max-width: 600px; margin: 0 auto; padding: 16px; }
.addrow { display: flex; gap: 8px; }
#add { background: #7c5cff; color: #fff; border: none;
       border-radius: 9px; padding: 9px 16px; cursor: pointer; }
li.task { display: flex; align-items: center; gap: 9px;
          border: 1px solid #e2e6f0; border-radius: 11px; padding: 10px; }
</style>
<!-- load the COMPILED js, as a module so it can import model.js -->
<script type="module" src="app.js"></script>
